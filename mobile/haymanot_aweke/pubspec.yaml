name: haymanot_aweke
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  equatable: ^2.0.7 
  dartz: ^0.10.1
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  lints: ^5.0.0
  mockito: ^5.5.0
  build_runner: ^2.6.0
  internet_connection_checker: ^3.0.1
  equatable: ^2.0.7
  http: ^1.4.0
  shared_preferences: ^2.5.3
  dartz: ^0.10.1
  flutter_bloc: ^9.1.1
  get_it: ^8.0.3

flutter:

  uses-material-design: true


  assets:
    - assets/images/


  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
 